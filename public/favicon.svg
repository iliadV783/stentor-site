<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Sténtor</title>
  <desc id="desc">Icona Sténtor con profilo classico in bronzo e linee vocali.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="74%">
      <stop offset="0" stop-color="#24211e"/>
      <stop offset="0.62" stop-color="#11100f"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="bronze" x1="22%" y1="18%" x2="82%" y2="88%">
      <stop offset="0" stop-color="#ffbd7a"/>
      <stop offset="0.18" stop-color="#d9783f"/>
      <stop offset="0.5" stop-color="#b6502f"/>
      <stop offset="0.74" stop-color="#e28a4a"/>
      <stop offset="1" stop-color="#763018"/>
    </linearGradient>
    <linearGradient id="edge" x1="15%" y1="0" x2="88%" y2="100%">
      <stop offset="0" stop-color="#ffd29e"/>
      <stop offset="0.35" stop-color="#c55d35"/>
      <stop offset="0.72" stop-color="#6e2c18"/>
      <stop offset="1" stop-color="#f0a76a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.48"/>
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#fff" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="108" fill="url(#bg)"/>
  <rect x="11" y="11" width="1002" height="1002" rx="98" fill="none" stroke="#7a6256" stroke-width="8" opacity="0.55"/>
  <circle cx="512" cy="512" r="399" fill="none" stroke="url(#edge)" stroke-width="20" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="382" fill="none" stroke="#070707" stroke-width="8" opacity="0.72"/>

